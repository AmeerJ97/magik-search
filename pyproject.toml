[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magik-search"
version = "0.3.2"
description = "Drive-aware filesystem discovery with adaptive workers and live telemetry"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "magik-search contributors"}]
keywords = ["filesystem", "search", "magika", "lvm", "tui", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
magika = ["magika>=0.6"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[project.scripts]
magik-search = "magik_search.cli:main"

[tool.setuptools.packages.find]
include = ["magik_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
